          write_handover call and gained a second, appended line "report commit
          skipped: git busy"; the lock (young, no git process) was left untouched
          per the existing rule.
      - id: C2
        criterion: "Every other path unchanged"
        status: closed
        evidence: >
          Reran S-014's C1 to C4 in a fresh scratch harness. C1: a lock held by a
          real process literally named "git" (pgrep -x git needs the executable's
          own name, not just argv[0]) left alone, exit 8, handover reads "SKIPPED:
          git busy" / "nothing removed, .git/index.lock present while a git process
          is running". C2: a 10-minute-old lock with no git process removed, commit
          proceeds, handover names the lock and its age. C3: a lock created moments
          earlier with no git process left alone, exit 8, same "SKIPPED: git busy"
          shape. C4: no lock, handover keeps the pre-S-014, pre-S-024 shape
          (RAN, committed <hash> / push result). All four match the wording in the
          O-0001 report's S-014 evidence.
      - id: C3
