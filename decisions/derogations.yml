# Derogations: recorded, time-boxed exceptions to the rules the Tower enforces.
# The full list of everything currently not conformant, in one place.
#
# Rules, see policy/self-governance.md:
#   - Only Yassir grants. Claude proposes, Claude never grants, extends or renews.
#   - expires_on or trigger is mandatory. Neither means invalid, and the audit
#     reports it as a breach rather than an exception.
#   - state: proposed | granted | expired | revoked | closed
#   - An expired derogation is a red state, not a grace period.

derogations:

  - id: X-001
    scope: control-tower
    rule: "Never run code from dev/. What runs is what promote wrote into prod/."
    reason: >
      The M0 heartbeat is the Tower's first code, and it has to run nightly to
      prove the Tower can work unattended. promote.sh is M1 work, so there is no
      way to promote the very thing that proves promotion is worth building.
    proposed_by: claude
    proposed_on: 2026-09-20
    granted_by: Yassir
    granted_on: 2026-09-20
    expires_on: ""
    trigger: "M1 delivers bin/promote.sh. heartbeat.sh and run-operations.sh are then promoted, S-021, and this closes."
    state: granted
    covers:                      # the only files allowed to run from dev/, named explicitly
      - "AI Control Tower/dev/bin/heartbeat.sh"
      - "AI Control Tower/dev/bin/run-operations.sh"
    widened_by: Yassir           # run-operations.sh added, the runner's dispatcher, S-015, D-017
    widened_on: 2026-09-21
    compensating_control: >
      Two files covered, named explicitly above, and nothing else. The heartbeat writes a
      handover entry on every run, and once S-015 ships the runner overwrites a liveness
      file every wake, so a silent failure turns the status red within the hour rather
      than being found weeks later.
    breaks_if_denied: >
      M0 cannot run. The alternative is building promote.sh first, which makes M0
      a multi-day milestone instead of a half-day one and proves the risky thing
      last instead of first.

  - id: X-002
    scope: control-tower
    rule: "The M0 hold: build no UI until M0 has passed its exit test, three unattended nights."
    reason: >
      Yassir asked for the status dashboard as a local web page before M0 passed, and
      said so when the conflict with the hold was put to him. S-012 built the Flask
      server basis in "AI Control Tower/dev/ui" on that answer. Recorded after the
      fact, on the 21:55 read, because until now the hub carried it as an
      unrecorded breach.
    proposed_by: claude
    proposed_on: 2026-09-20
    granted_by: Yassir
    granted_on: 2026-09-20
    expires_on: ""
    trigger: "S-004 passes. The hold lifts and the UI is then in scope by design."
    state: granted
    compensating_control: >
      The UI is read-only: it renders status/status.json and changes nothing on disk.
      It is dev-only scaffolding outside the M0 story count and does not touch the
      exit test. Covered: "AI Control Tower/dev/ui" and launchers/start-ui.command,
      nothing else. S-013 is NOT covered and waits for the hold to lift or for its
      own derogation.
    breaks_if_denied: >
      The UI would have to be removed to _to_delete/ until S-004 passes, and the
      status would go back to the side doc only.

# Not derogations, recorded here so they are not mistaken for breaches:
#   - The Tower has no frozen adoption copy (step zero of the adopt pipeline).
#     Not applicable: it was created empty on 2026-09-20, there is nothing to
#     freeze and no original to preserve.
#   - _tower has no baseline test suite. Not yet applicable: M0's acceptance
#     evidence is the three unattended nights. A suite arrives with M1.
