id: platform-architecture
name: Platform Architecture
one_liner: Defines the shared technical platform every other app is built and deployed on, and tracks the hardware, network and IoT decisions that platform rests on
status: unmanaged
owner_chat: "Platform Architecture"
aliases: ["AI Architecture Tower", "ai-architecture-tower"]   # former registry name, 2026-09-20. Same project, renamed, never a second one.

# DOCS-ONLY by design. This project has no code and is not expected to grow any.
# The Tower's duty toward it is the fivefold duty in architecture/README.md:
# retain rather than reinvent, keep a status line and refresh it by re-reading,
# enforce it on every governed app, propagate changes when open decisions resolve,
# and do not freeze today's specifics.

# SCOPE, expanded 2026-09-20 on Yassir's instruction. Three areas added to the
# platform design, tracked here and nowhere else. Explicitly NOT a new project: a
# proposed separate "AI Architecture Tower" was rejected, this file is where it lands.
scope:
  areas:
    - id: platform
      what: "the shared platform: containers, Portal, Caddy, Cloudflare, Tailscale, Postgres, media"
      since: 2026-09-20
    - id: hardware
      what: "hardware purchase decisions: the Mac mini and anything bought to run or serve the platform, with what each purchase unblocks"
      since: 2026-09-20
    - id: network
      what: "VPN and network configuration: Tailscale, Cloudflare Tunnel and Access, DNS and domain, LAN layout, what is reachable from where"
      since: 2026-09-20
    - id: iot
      what: "IoT architecture: sensors, hubs and device integration (Home Assistant sits on it), how devices reach the platform and what the platform exposes to them"
      since: 2026-09-20
  compatibility:
    rule: "every decision in every area is written for both targets, or says which one it excludes and why"
    targets:
      - id: macbook-now
        what: "the current setup: everything on the MacBook Pro, prod/ is a folder, no public entry point"
      - id: mac-mini-future
        what: "the future setup: Mac mini at home behind Cloudflare Access, the platform as designed in the living doc"
    transition: "a decision that only works on one target is flagged, and the platform doc's status line names it as a migration item"

paths:
  root: ""                 # docs-only, no folder under the hub yet. At adoption: "Platform Architecture/docs/"
  docs: ""

source_of_truth:
  living_doc: https://claude.ai/code/artifact/336e1b53-42d4-4e95-b03b-2e96c6e03c4b
  control_tower_prompt_tab: "second tab, defines the five duties"
  note: "The doc's title predates the pivot to local hosting. Trust the content over the title. The three added scope areas are not in the doc yet; they enter it at adoption, one section each."

status_line:               # refreshed by re-reading the doc, never from memory
  last_read: 2026-09-20
  last_seen_rev: 12
  phase_reached: "design, nothing built"
  blocking_open_decisions:
    - "Mac mini not ordered, so every hosting decision is unexercised (hardware area)"
    - "domain name (network area)"
    - "Jellyfin vs Plex"
    - "backup strategy"

findings:
  - id: AT-F1
    severity: low
    finding: "No folder under the hub, so its docs are not mirrored, backed up or versioned with everything else."
    rule: "governed means every file under the root"
    fix_at: "adoption, one docs/ folder and one repo. Cheapest adoption of any candidate."
  - id: PA-F2
    severity: low
    finding: "Hardware, network and IoT decisions have been made in chats and nowhere on disk. Until adoption they exist only in the living doc and in Yassir's head."
    rule: "decided once, dispatched everywhere, never re-decided per project"
    fix_at: "adoption: one section per scope area in the living doc, each open item carried into the status line above"

blocking:
  - "M0 has not passed."
  - "D-012 answered 2026-09-20: this project is second, the cheap rehearsal after the Tower itself."
  - "D-013 open: M1's exit test assumes a project with code and this one is docs-only."
