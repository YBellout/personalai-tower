# The Control Tower's own configuration. One file, one root.
root: /Users/yassirbellout/Documents/PersonalAI
created: 2026-09-20
root_confirmed_by: Yassir       # S-001, 2026-09-20. Read and written this session.
root_confirmed_on: 2026-09-20

# The Tower's own code is a governed project like any other.
tower_project: AI Control Tower
tower_code_prod: AI Control Tower/prod
tower_code_dev: AI Control Tower/dev

mirror:
  targets:
    - name: local
      path: "~/PersonalAI-mirror"   # D-003. Fallback. Replaced by the external drive's
                          # path if Yassir has one, which is still to be confirmed.
      enabled: true       # enabled per D-003, but mirror.sh does not exist until M1:
                          # NOTHING IS BEING MIRRORED TODAY. Do not read this as backup.
    - name: offsite
      kind: object-store
      enabled: false      # decided later, interface written so this is a flag
  verify: sha256
  warn_after_days: 7

git:
  remote_host: github.com
  account: "YBellout"     # D-002, given by Yassir 2026-09-20, verified on github.com.
  tower_repo: personalai-tower
  credential: osxkeychain # Set by S-003a. The heartbeat runs on macOS under launchd,
                          # where the osxkeychain helper exists. A push from the Claude
                          # Linux VM cannot work: that helper is absent there. Verified
                          # 2026-09-20: git ls-remote from the VM fails on it.
  visibility: private

residency:
  rule: every governed project lives entirely under root, on local disk
  never: [iCloud Drive, any cloud-synced folder]
  scan_for_strays: ["~/Desktop", "~/Documents", "~/Downloads"]   # D-006. ~/Developer
                          # dropped, it does not exist. Grants are requested when
                          # the scan first runs, at M1: grants do not outlive a session.

permissions:
  posture: allow-audit    # nightly audit reports, nothing blocked
  ratchet_to: deny-default
  ratchet_trigger: "the Mac mini goes live behind Cloudflare Access"

platform:
  mac_mini: not_ordered
  transport_when_it_exists: github
